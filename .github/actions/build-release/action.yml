name: Build release
description: Install, build (type-check + lint + compile) and package the Next.js standalone release as release.tgz

inputs:
  site-url:
    description: NEXT_PUBLIC_SITE_URL baked into the build
    required: true
  turnstile-site-key:
    description: NEXT_PUBLIC_TURNSTILE_SITE_KEY baked into the build (optional)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'content/**', 'styles/**') }}
        restore-keys: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build (type-check + lint + compile)
      shell: bash
      env:
        NEXT_TELEMETRY_DISABLED: "1"
        NEXT_PUBLIC_SITE_URL: ${{ inputs.site-url }}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ inputs.turnstile-site-key }}
      run: pnpm build

    - name: Package release
      shell: bash
      run: |
        set -euo pipefail
        rm -rf release release.tgz
        mkdir -p release
        cp -a .next/standalone/. release/
        cp -a .next/static release/.next/static
        cp -a public release/public
        cp -a drizzle release/drizzle
        cp ecosystem.config.cjs release/
        # never ship local env files
        find release -maxdepth 1 -name '.env*' -delete
        # sharp must be the linux-arm64 (glibc) build, or images 500 on the Ampere server
        ls release/node_modules/.pnpm | grep -q '^@img+sharp-linux-arm64@' || { echo "::error::linux-arm64 sharp missing from bundle"; exit 1; }
        tar -czf release.tgz -C release .
        du -h release.tgz
