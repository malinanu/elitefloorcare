name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PRs: prove the release builds. No environment, so no secrets and no server access.
  check:
    if: github.event_name == 'pull_request'
    # The server is an Oracle Ampere (ARM64) box and the standalone bundle carries the
    # build machine's sharp binary, so every build runs on ARM64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-release
        with:
          site-url: https://example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  # main / manual: build with the staging environment's values, then ship it.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # never kill a deploy half way; queue the next one
    env:
      APP_DIR: ${{ vars.APP_DIR || secrets.APP_DIR }}
      APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || '3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ok=1
          for v in SITE_URL SSH_PRIVATE_KEY SSH_HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::'${v/SITE_URL/NEXT_PUBLIC_SITE_URL}' is not set in the staging environment"; ok=0; }
          done
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set. On your own machine run:  ssh-keyscan -p <SSH_PORT> <SSH_HOST>  and save the whole output as the SSH_KNOWN_HOSTS secret in the staging environment."
            ok=0
          fi
          [ "$ok" = 1 ]

      - uses: ./.github/actions/build-release
        with:
          site-url: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          turnstile-site-key: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Configure SSH (pinned host key)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ConnectTimeout 20
          EOF

      - name: Upload release
        run: |
          set -euo pipefail
          ssh server 'mkdir -p ~/deploy-inbox'
          scp release.tgz server:~/deploy-inbox/release-${{ github.sha }}.tgz
          scp scripts/deploy.sh server:~/deploy-inbox/deploy.sh

      - name: Activate release
        run: |
          ssh server "chmod +x ~/deploy-inbox/deploy.sh && \
            APP_DIR='${APP_DIR}' APP_PORT='${APP_PORT}' \
            ~/deploy-inbox/deploy.sh ~/deploy-inbox/release-${{ github.sha }}.tgz ${{ github.sha }}"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
