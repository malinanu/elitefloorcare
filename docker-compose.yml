# Production stack: web + Postgres. Works as a Portainer "stack" (paste this file, add env vars in the UI)
# or from the CLI:  docker compose --env-file .env up -d --build
# Put CloudPanel / your reverse proxy in front of 127.0.0.1:3000 with TLS.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: elite-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://efc:${POSTGRES_PASSWORD}@db:5432/efc
    ports:
      - "127.0.0.1:3000:3000" # only the reverse proxy should reach it
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: efc
      POSTGRES_DB: efc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - efc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efc -d efc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local testing only: catches outgoing mail at http://localhost:8025
  #   docker compose --profile dev up mailpit   and set SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_SECURE=false
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  efc-pg:
