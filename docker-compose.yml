# Optional Docker route. The main deploy is the CloudPanel Node.js site via GitHub Actions (see README).
#   docker compose --env-file .env up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: elite-web:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - efc-data:/data     # SQLite (Payload)
      - efc-media:/media   # CMS uploads

  # Local testing only: catches outgoing mail at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  efc-data:
  efc-media:
